[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-hero"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "datasets",
    "transformers",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
